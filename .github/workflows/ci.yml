name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Data Quality Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 41 Data Quality & Integrity Validator Tests
        run: |
          pytest -v tests/test_validation.py

      - name: Verify Module Imports & Fast API Initialization
        run: |
          python -c "from scripts.api import app; print('FastAPI App loaded successfully!')"
