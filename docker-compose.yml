version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bank_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bank_dwh}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD must be provided}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema/create_tables.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bank_dwh}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: bank_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-bank_dwh}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Error: DB_PASSWORD must be provided}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8000}
      API_AUTH_ENABLED: ${API_AUTH_ENABLED:-false}
      DEMO_MODE: ${DEMO_MODE:-false}
    ports:
      - "8000:8000"

volumes:
  postgres_data:
